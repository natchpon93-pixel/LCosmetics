# ═══════════════════════════════════════════════════════════
#  LCosmetics — รายการเครื่องแต่งกาย
# ═══════════════════════════════════════════════════════════
#
#  วิธีเพิ่มของใหม่:
#
#  ไอดีของคุณ:                  ← ชื่อที่ใช้ในคำสั่ง /cos apply <ไอดี>
#    slot: HELMET               ← ใส่ช่องไหน (ดูรายการด้านล่าง)
#    permission: "lcosmetics.ไอดี"   ← เว้นว่าง = ทุกคนใช้ได้
#    item:
#      material: nexo:ชื่อไอเทม  ← ของจาก Nexo, หรือใส่ชื่อ vanilla เช่น DIAMOND_HELMET
#      name: "&bชื่อที่โชว์"
#      lore:
#        - "&7คำอธิบาย"
#    firstperson-item:          ← ไม่จำเป็น: รูปที่เจ้าตัวเห็นเอง (เป้/ปีก มักใช้)
#      material: nexo:ชื่อไอเทม_thirdperson
#
#  ช่องที่ใช้ได้:
#    HELMET      หมวก          — คนอื่นเห็นทับหมวกจริง
#    CHESTPLATE  เสื้อ
#    LEGGINGS    กางเกง
#    BOOTS       รองเท้า
#    OFFHAND     ของถือมือซ้าย
#    BACKPACK    เป้/ปีก        — เป็น display entity ติดหลัง
#    BALLOON     ลูกโป่ง        — display entity ลอยเหนือหัว
#
#  เกราะจริงยังป้องกันปกติทุกกรณี — cosmetic แค่เปลี่ยนรูปที่คนอื่นเห็น
# ═══════════════════════════════════════════════════════════

# ───────── หมวก ─────────
